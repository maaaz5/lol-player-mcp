[project]
name = "lol-player-mcp"
version = "0.1.0"
description = "A MCP server for League of Legends, built with Python, FastMCP, and Riot Games API."
readme = "README.md"
authors = [
    { name = "MohamedAmine Azirgui", email = "mohamed.a.azirgui@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "mcp[cli]<2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_mcp"]

[project.scripts]
lol-mcp = "lol_mcp.server:main"